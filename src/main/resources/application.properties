# Quarkus Configuration
quarkus.application.name=pptx-generator

# JAXB Configuration for docx4j
quarkus.native.additional-build-args=--initialize-at-run-time=org.docx4j.jaxb.NamespacePrefixMapperUtils

# MySQL Configuration
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=content_user
quarkus.datasource.password=password
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/content_creation

# Hibernate - use Flyway for schema management, disable validation
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.database.generation.halt-on-error=false

# Flyway Configuration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# MinIO S3 Configuration
minio.url=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket.templates=templates
minio.bucket.results=results

# AI Configuration
app.ai.provider=${AI_PROVIDER:ollama}
app.ai.min-request-interval-ms=${AI_MIN_REQUEST_INTERVAL_MS:100}
app.pipeline.debug-json=${PIPELINE_DEBUG_JSON:true}

# Ollama Configuration (local server, OpenAI-compatible API)
ollama.api.url=${OLLAMA_API_URL:http://localhost:11434/v1}
ollama.model.default=${OLLAMA_MODEL:gemma3:4b}
ollama.request.timeout-seconds=${OLLAMA_TIMEOUT:600}

# OpenRouter Configuration
openrouter.api.url=${OPENROUTER_API_URL:https://openrouter.ai/api/v1}
openrouter.api.key=${OPENROUTER_API_KEY:}
openrouter.model.default=${OPENROUTER_MODEL:openrouter/free}
openrouter.request.timeout-seconds=${OPENROUTER_TIMEOUT:60}

# OpenCode Zen Configuration (https://opencode.ai/zen)
# Endpoint style is resolved automatically from the model id (claude-/qwen- → /messages,
# anything else → /chat/completions); force it with zen.endpoint-style=chat|messages.
zen.api.url=${ZEN_API_URL:https://opencode.ai/zen/v1}
zen.api.key=${ZEN_API_KEY:}
zen.model.default=${ZEN_MODEL:glm-5.3-flash}
zen.request.timeout-seconds=${ZEN_TIMEOUT:300}
zen.endpoint-style=${ZEN_ENDPOINT_STYLE:auto}

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.pptxgenerator".level=DEBUG

# Swagger UI
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.smallrye-openapi.info-title=PPTX Generator API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API de génération de présentations PowerPoint pilotée par IA
