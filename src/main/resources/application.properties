# Quarkus Configuration
quarkus.application.name=pptx-generator

# Upload limits (CWE-434 defence in depth): 10 MB, aligned with ContentService.MAX_UPLOAD_SIZE_BYTES
quarkus.http.limits.max-body-size=10M

# JAXB Configuration for docx4j
quarkus.native.additional-build-args=--initialize-at-run-time=org.docx4j.jaxb.NamespacePrefixMapperUtils

# MySQL Configuration
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${DB_USERNAME:content_user}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:mysql://localhost:3306/content_creation}

# Hibernate - use Flyway for schema management, disable validation
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.database.generation.halt-on-error=false

# Flyway Configuration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# MinIO S3 Configuration (single bucket, folder prefixes: templates/, contents/input/, contents/output/)
minio.url=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:}
minio.secret-key=${MINIO_SECRET_KEY:}
minio.bucket=${MINIO_BUCKET:contents}

# AI Configuration (OpenCode Zen — https://opencode.ai/zen)
app.pipeline.debug-json=${PIPELINE_DEBUG_JSON:false}

# OpenCode Zen Configuration
# Endpoint style is resolved automatically from the model id (claude-/qwen- → /messages,
# anything else → /chat/completions); force it with zen.endpoint-style=chat|messages.
zen.api.url=${ZEN_API_URL:https://opencode.ai/zen/v1}
zen.api.key=${ZEN_API_KEY:}
zen.model.default=${ZEN_MODEL:glm-5.3-flash}
zen.request.timeout-seconds=${ZEN_TIMEOUT:300}
zen.endpoint-style=${ZEN_ENDPOINT_STYLE:auto}

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.pptxgenerator".level=${APP_LOG_LEVEL:INFO}

# Swagger UI
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.smallrye-openapi.info-title=PPTX Generator API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API de génération de présentations PowerPoint pilotée par IA
