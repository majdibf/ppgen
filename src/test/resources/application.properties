# Test configuration
quarkus.application.name=pptx-generator-test

# Disable database for unit tests
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=drop-and-create

# Disable Flyway for tests
quarkus.flyway.migrate-at-start=false

# AI Configuration
app.ai.mock=true
app.ai.provider=groq

# MinIO S3 Configuration (disabled for tests)
minio.url=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket.templates=templates
minio.bucket.results=results

# Logging
quarkus.log.level=WARN
quarkus.log.category."com.pptxgenerator".level=DEBUG
