# Quarkus Configuration
quarkus.application.name=pptx-generator

# AI Configuration
app.ai.mock=true
app.ai.provider=groq

# OpenRouter Configuration
openrouter.api.url=${OPENROUTER_API_URL:https://openrouter.ai/api/v1}
openrouter.api.key=${OPENROUTER_API_KEY:}
openrouter.model.default=${OPENROUTER_MODEL:openrouter/free}

# Groq Configuration
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1}
groq.api.key=${GROQ_API_KEY:}
groq.model.default=${GROQ_MODEL:openai/gpt-oss-20b}

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.pptxgenerator".level=DEBUG
